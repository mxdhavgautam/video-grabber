<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Extractor - Video Grabber</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #fff;
    }
    p {
      color: #a0a0a0;
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .button:hover {
      background: #2563eb;
    }
    .button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #1f2937;
      color: #9ca3af;
      font-size: 14px;
    }
    .status.success {
      background: #065f46;
      color: #6ee7b7;
    }
    .status.error {
      background: #7f1d1d;
      color: #fca5a5;
    }
    code {
      background: #0f172a;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube Cookie Extractor</h1>
    <p>
      This page will help you extract YouTube cookies from your browser.
      Click the button below to open YouTube and extract your cookies.
    </p>
    <p>
      <strong>Note:</strong> You must be logged into YouTube in your browser for this to work.
    </p>
    <button id="extractBtn" class="button">Extract Cookies from YouTube</button>
    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script>
    const extractBtn = document.getElementById('extractBtn');
    const statusDiv = document.getElementById('status');

    function showStatus(message, type = 'info') {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
      statusDiv.style.display = 'block';
    }

    function convertCookiesToNetscape(cookies) {
      let netscape = '# Netscape HTTP Cookie File\n';
      netscape += '# This file was generated by Video Grabber Cookie Extractor\n';
      netscape += '# Format: domain\tflag\tpath\tsecure\texpiration\tname\tvalue\n\n';

      for (const cookie of cookies) {
        const domain = cookie.domain || '.youtube.com';
        const flag = 'TRUE';
        const path = cookie.path || '/';
        const secure = cookie.secure ? 'TRUE' : 'FALSE';
        const expiration = cookie.expires ? Math.floor(new Date(cookie.expires).getTime() / 1000) : 0;
        const name = cookie.name;
        const value = cookie.value;

        netscape += `${domain}\t${flag}\t${path}\t${secure}\t${expiration}\t${name}\t${value}\n`;
      }

      return netscape;
    }

    extractBtn.addEventListener('click', async () => {
      extractBtn.disabled = true;
      showStatus('Opening YouTube...', 'info');

      // Open YouTube in a new window
      const youtubeWindow = window.open(
        'https://www.youtube.com',
        'youtube-cookie-extract',
        'width=800,height=600'
      );

      if (!youtubeWindow) {
        showStatus('Popup blocked! Please allow popups for this site.', 'error');
        extractBtn.disabled = false;
        return;
      }

      // Wait for YouTube to load, then try to extract cookies
      setTimeout(async () => {
        try {
          showStatus('Attempting to extract cookies...', 'info');

          // We can't directly access cookies from cross-origin window
          // So we'll use a different approach: inject a script via bookmarklet
          // OR use postMessage to communicate with YouTube (won't work due to CORS)
          
          // The only reliable way is to have the user run a bookmarklet
          // OR use a browser extension
          // OR have the user manually export cookies
          
          // For now, let's try to use document.cookie if we can access it
          // But we can't due to CORS
          
          // FALLBACK: Show instructions to user
          showStatus('Cross-origin cookie access is blocked by browser security. Please use the bookmarklet method or browser extension.', 'error');
          extractBtn.disabled = false;
          
          // Close YouTube window
          youtubeWindow.close();
        } catch (error) {
          showStatus(`Error: ${error.message}`, 'error');
          extractBtn.disabled = false;
          youtubeWindow.close();
        }
      }, 3000);
    });

    // Listen for messages from parent window (if opened as popup)
    window.addEventListener('message', (event) => {
      // Only accept messages from same origin
      if (event.origin !== window.location.origin) {
        return;
      }

      if (event.data.type === 'EXTRACT_COOKIES') {
        // Try to extract cookies using chrome.cookies API (if extension)
        // OR use document.cookie (only works for same-origin)
        try {
          // Check if we're on YouTube domain
          if (window.location.hostname.includes('youtube.com')) {
            const cookies = document.cookie.split(';').map(c => c.trim()).filter(c => c);
            if (cookies.length > 0) {
              const cookieObjects = cookies.map(c => {
                const [name, value] = c.split('=');
                return { name: name.trim(), value: value.trim() };
              });
              
              const netscapeFormat = convertCookiesToNetscape(cookieObjects);
              
              // Send cookies back to parent
              window.opener.postMessage({
                type: 'COOKIES_EXTRACTED',
                cookies: cookieObjects,
                netscape: netscapeFormat
              }, event.origin);
              
              showStatus('Cookies extracted successfully!', 'success');
              setTimeout(() => window.close(), 2000);
            } else {
              showStatus('No cookies found. Make sure you are logged into YouTube.', 'error');
            }
          } else {
            showStatus('This page must be opened on YouTube domain to extract cookies.', 'error');
          }
        } catch (error) {
          showStatus(`Error: ${error.message}`, 'error');
          window.opener.postMessage({
            type: 'COOKIES_ERROR',
            error: error.message
          }, event.origin);
        }
      }
    });
  </script>
</body>
</html>
