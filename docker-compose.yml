services:
  tor-proxy:
    platform: linux/amd64
    image: pimylifeup/tor-proxy:latest
    restart: unless-stopped
    # Tor proxy exposes SOCKS5 on port 9050
    # This routes requests through Tor network (residential IPs from exit nodes)
    # Helps bypass datacenter IP detection - Hetzner VPS IPs are flagged by YouTube
    networks:
      - video-grabber
    # No need to expose port externally - only backend container uses it
    # SOCKS5 proxy available at tor-proxy:9050 within Docker network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Tor takes time to bootstrap circuits

  po-token-provider:
    platform: linux/amd64
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "4416:4416"
    networks:
      - video-grabber
    # Healthcheck - try curl, wget, or just check if port is listening
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4416/health || wget -qO- http://127.0.0.1:4416/health || nc -z localhost 4416 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      platforms:
        - linux/amd64
    env_file:
      - apps/backend/.env.production
    environment:
      - PO_TOKEN_PROVIDER_URL=http://po-token-provider:4416
      - USE_VNC=true
      - DISPLAY=:99
      - USE_TOR_PROXY=true  # Enable Tor proxy to bypass datacenter IP detection (default: true)
      - TOR_PROXY_URL=socks5h://tor-proxy:9050  # Tor proxy URL (socks5h resolves DNS through proxy)
    ports:
      - "3001:3001"
      - "5900:5900"  # VNC port (optional, for debugging)
    volumes:
      - backend_data:/var/lib/video-grabber
    restart: unless-stopped
    networks:
      - video-grabber
    depends_on:
      tor-proxy:
        condition: service_started
      po-token-provider:
        condition: service_started
    # Note: PO provider may show as unhealthy but it's still functional
    # The server starts successfully as seen in logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Start Xvfb and VNC server for non-headless Chrome
    # Using a startup script to initialize Xvfb before the app starts
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # Start Xvfb virtual display in background
        Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset > /dev/null 2>&1 &
        export DISPLAY=:99
        
        # Wait for Xvfb to be ready
        sleep 2
        
        # Start VNC server (optional, for remote viewing/debugging)
        x11vnc -display :99 -nopw -listen localhost -xkb -forever -shared -rfbport 5900 > /dev/null 2>&1 &
        
        # Start lightweight window manager
        fluxbox > /dev/null 2>&1 &
        
        # Wait a moment for everything to initialize
        sleep 1
        
        echo "[Docker] Xvfb display :99 started"
        echo "[Docker] VNC server started on port 5900 (accessible via localhost:5900)"
        echo "[Docker] Starting backend application..."
        
        # Start the actual application (preserve dumb-init for proper signal handling)
        exec dumb-init -- node apps/backend/src/index.mjs

  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      platforms:
        - linux/amd64
      args:
        VITE_API_URL: ${VITE_API_URL:-https://video-grabber-api.mxdhavgautam.com/api}
    environment:
      - NODE_ENV=production
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - video-grabber

  caddy:
    platform: linux/amd64
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - ACME_AGREE=true
      - ACME_EMAIL=${ACME_EMAIL:-admin@mxdhavgautam.com}
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - video-grabber

networks:
  video-grabber:
    driver: bridge

volumes:
  backend_data:
  caddy_data:
  caddy_config:

