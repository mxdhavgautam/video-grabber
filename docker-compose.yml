services:
  po-token-provider:
    platform: linux/amd64
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    ports:
      - "4416:4416"
    networks:
      - video-grabber
    # Healthcheck using curl (should be available in the container)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4416/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      platforms:
        - linux/amd64
    env_file:
      - apps/backend/.env.production
    environment:
      - PO_TOKEN_PROVIDER_URL=http://po-token-provider:4416
    ports:
      - "3001:3001"
    volumes:
      - backend_data:/var/lib/video-grabber
    restart: unless-stopped
    networks:
      - video-grabber
    depends_on:
      po-token-provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      platforms:
        - linux/amd64
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    environment:
      - NODE_ENV=production
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - video-grabber

  caddy:
    platform: linux/amd64
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - ACME_AGREE=true
      - ACME_EMAIL=${ACME_EMAIL:-admin@mxdhavgautam.com}
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - video-grabber

networks:
  video-grabber:
    driver: bridge

volumes:
  backend_data:
  caddy_data:
  caddy_config:

